<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Three Star Plastic Industry</title>

<meta name="description"
content="Three Star Plastic Industry - Recycled Plastic Dana, Granules, Crush and Industrial Materials">

<style>

/* =========================================================
   THREE STAR PLASTIC INDUSTRY
   COMPLETE SINGLE FILE WEBSITE
========================================================= */

:root{
    --gold:#f5bd45;
    --gold-light:#ffe8a8;
    --dark:#02060d;
    --dark2:#071321;
    --dark3:#0c1d31;
    --white:#ffffff;
    --muted:#aab8ca;
    --line:rgba(255,255,255,.12);
    --glass:rgba(255,255,255,.055);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;

    background:
    radial-gradient(
        circle at 15% 10%,
        #183d65 0%,
        #071321 38%,
        #02060d 100%
    );

    color:var(--white);
    overflow-x:hidden;
}

body.no-scroll{
    overflow:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}

.container{
    width:92%;
    max-width:1180px;
    margin:auto;
}

/* =========================================================
   BACKGROUND
========================================================= */

#particles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-5;
    pointer-events:none;
}

.background-grid{
    position:fixed;
    inset:0;
    z-index:-4;
    pointer-events:none;
    opacity:.18;

    background-image:
    linear-gradient(
        rgba(245,189,69,.05) 1px,
        transparent 1px
    ),
    linear-gradient(
        90deg,
        rgba(245,189,69,.05) 1px,
        transparent 1px
    );

    background-size:50px 50px;

    mask-image:
    linear-gradient(
        to bottom,
        black,
        transparent 80%
    );
}

.glow{
    position:fixed;
    width:320px;
    height:320px;
    border-radius:50%;
    background:var(--gold);
    filter:blur(140px);
    opacity:.07;
    z-index:-3;
    pointer-events:none;
}

.glow-one{
    top:10%;
    left:-180px;
}

.glow-two{
    right:-180px;
    bottom:10%;
}

/* =========================================================
   PRELOADER
========================================================= */

#loader{
    position:fixed;
    inset:0;
    background:#02060d;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:
    opacity .7s ease,
    visibility .7s ease;
}

#loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-content{
    text-align:center;
}

.loader-stars{
    font-size:45px;
    color:var(--gold);
    letter-spacing:-8px;
    text-shadow:
    0 0 10px var(--gold),
    0 0 35px var(--gold);
    animation:
    loaderPulse 1.4s infinite;
}

.loader-title{
    margin-top:18px;
    font-size:17px;
    font-weight:900;
    letter-spacing:3px;
}

.loader-subtitle{
    margin-top:8px;
    color:var(--muted);
    font-size:10px;
    letter-spacing:3px;
}

.loader-line{
    width:190px;
    height:3px;
    background:#182638;
    margin:20px auto 0;
    overflow:hidden;
    border-radius:10px;
}

.loader-line span{
    display:block;
    width:45%;
    height:100%;
    background:var(--gold);
    animation:loaderLine 1.2s infinite;
}

@keyframes loaderPulse{
    50%{
        transform:scale(1.08);
    }
}

@keyframes loaderLine{
    from{
        transform:translateX(-120%);
    }
    to{
        transform:translateX(330%);
    }
}

/* =========================================================
   NAVIGATION
========================================================= */

.navbar{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    z-index:500;

    background:
    rgba(2,7,15,.72);

    backdrop-filter:blur(18px);

    border-bottom:
    1px solid var(--line);

    transition:.3s;
}

.navbar.scrolled{
    background:
    rgba(2,7,15,.94);

    box-shadow:
    0 12px 40px rgba(0,0,0,.25);
}

.nav-inner{
    height:78px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:max-content;
}

.brand-stars{
    display:flex;
    gap:1px;
}

.brand-stars span{
    color:var(--gold);
    font-size:18px;
    line-height:1;

    text-shadow:
    0 0 9px var(--gold);
}

.brand-name{
    font-weight:900;
    font-size:16px;
    letter-spacing:1px;
}

.brand-name small{
    display:block;
    color:var(--gold-light);
    font-size:8px;
    letter-spacing:3px;
    margin-top:3px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:26px;
}

.nav-links a{
    position:relative;
    color:#dce5f1;
    font-size:13px;
    font-weight:600;
    padding:30px 0;
    transition:.3s;
}

.nav-links a:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:22px;
    height:2px;
    background:var(--gold);
    transform:scaleX(0);
    transition:.3s;
}

.nav-links a:hover,
.nav-links a.active{
    color:var(--gold-light);
}

.nav-links a:hover:after,
.nav-links a.active:after{
    transform:scaleX(1);
}

.nav-cta{
    padding:11px 16px!important;
    border:1px solid rgba(245,189,69,.45);
    border-radius:9px;
    color:var(--gold-light)!important;
}

.nav-cta:after{
    display:none;
}

.menu-btn{
    display:none;
    width:44px;
    height:44px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.05);
    color:white;
    border-radius:10px;
    font-size:23px;
    cursor:pointer;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;
    padding:
    130px 0
    70px;

    display:flex;
    align-items:center;
}

.hero-grid{
    display:grid;
    grid-template-columns:
    1.08fr
    .92fr;

    gap:50px;
    align-items:center;
}

.hero-content{
    animation:
    heroAppear 1s ease both;
}

@keyframes heroAppear{
    from{
        opacity:0;
        transform:translateY(35px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:
    9px 15px;

    border:
    1px solid
    rgba(245,189,69,.35);

    background:
    rgba(245,189,69,.07);

    border-radius:50px;

    color:var(--gold-light);

    font-size:11px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;

    margin-bottom:20px;
}

.badge-dot{
    width:7px;
    height:7px;
    background:var(--gold);
    border-radius:50%;
    box-shadow:0 0 10px var(--gold);
    animation:dotBlink 1.5s infinite;
}

@keyframes dotBlink{
    50%{
        opacity:.25;
    }
}

.hero h1{
    font-size:
    clamp(
        43px,
        6vw,
        78px
    );

    line-height:.98;

    letter-spacing:-3.5px;
}

.hero h1 .gold{
    color:var(--gold);
    text-shadow:
    0 0 30px rgba(245,189,69,.28);
}

.hero-description{
    max-width:670px;

    margin:
    25px 0;

    color:var(--muted);

    font-size:17px;

    line-height:1.8;
}

.hero-buttons{
    display:flex;
    gap:13px;
    flex-wrap:wrap;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    min-height:48px;

    padding:
    0 20px;

    border-radius:10px;

    border:
    1px solid var(--line);

    background:
    rgba(255,255,255,.04);

    color:white;

    font-size:13px;
    font-weight:800;

    transition:.3s;

    cursor:pointer;
}

.btn:hover{
    transform:translateY(-4px);
    border-color:rgba(245,189,69,.45);
}

.btn-primary{
    background:
    linear-gradient(
        135deg,
        #ffe7a0,
        #d8941e
    );

    color:#111827;

    border:0;

    box-shadow:
    0 14px 35px
    rgba(245,189,69,.18);
}

.hero-mini-info{
    margin-top:28px;

    display:flex;
    gap:25px;
    flex-wrap:wrap;
}

.hero-mini-info div{
    display:flex;
    align-items:center;
    gap:8px;

    color:#91a1b6;

    font-size:11px;
}

.hero-mini-info strong{
    color:var(--gold);
    font-size:17px;
}

/* =========================================================
   3D STAR AREA
========================================================= */

.hero-visual{
    min-height:470px;

    display:grid;
    place-items:center;

    perspective:1000px;

    position:relative;
}

.star-scene{
    width:350px;
    height:350px;

    position:relative;

    transform-style:preserve-3d;

    animation:
    sceneFloat 5s
    ease-in-out
    infinite;
}

@keyframes sceneFloat{
    0%,100%{
        transform:
        rotateX(0deg)
        rotateY(0deg)
        translateY(0);
    }

    50%{
        transform:
        rotateX(-7deg)
        rotateY(14deg)
        translateY(-17px);
    }
}

.star-layer{
    position:absolute;
    inset:0;

    display:grid;
    place-items:center;

    transform-style:preserve-3d;
}

.star-layer span{
    font-size:280px;

    line-height:1;

    color:transparent;

    -webkit-text-stroke:
    3px var(--gold);

    text-shadow:
    0 0 12px var(--gold),
    0 0 35px rgba(245,189,69,.75),
    0 0 75px rgba(245,189,69,.28);

    position:absolute;

    transform:
    translateZ(var(--depth))
    rotateY(var(--rotate));

    opacity:var(--opacity);
}

.star-layer:nth-child(1) span{
    --depth:0px;
    --rotate:0deg;
    --opacity:1;
}

.star-layer:nth-child(2) span{
    --depth:22px;
    --rotate:60deg;
    --opacity:.75;
}

.star-layer:nth-child(3) span{
    --depth:-22px;
    --rotate:-60deg;
    --opacity:.7;
}

.star-core{
    position:absolute;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%)
    translateZ(50px);

    text-align:center;

    pointer-events:none;
}

.star-core strong{
    display:block;

    color:white;

    font-size:12px;

    letter-spacing:4px;
}

.star-core small{
    display:block;

    color:var(--gold-light);

    font-size:7px;

    letter-spacing:3px;

    margin-top:5px;
}

.orbit{
    position:absolute;

    left:50%;
    top:50%;

    width:400px;
    height:400px;

    transform:
    translate(-50%,-50%)
    rotateX(68deg);

    border:
    1px solid
    rgba(245,189,69,.3);

    border-radius:50%;

    animation:
    orbitSpin 13s
    linear
    infinite;
}

.orbit-two{
    width:330px;
    height:330px;

    transform:
    translate(-50%,-50%)
    rotateX(70deg)
    rotateY(30deg);

    animation:
    orbitSpinReverse 9s
    linear
    infinite;

    border-color:
    rgba(255,255,255,.12);
}

.orbit-dot{
    position:absolute;

    width:10px;
    height:10px;

    background:var(--gold);

    border-radius:50%;

    right:25px;
    top:50%;

    box-shadow:
    0 0 15px
    var(--gold);
}

@keyframes orbitSpin{
    to{
        transform:
        translate(-50%,-50%)
        rotateX(68deg)
        rotateZ(360deg);
    }
}

@keyframes orbitSpinReverse{
    to{
        transform:
        translate(-50%,-50%)
        rotateX(70deg)
        rotateY(30deg)
        rotateZ(-360deg);
    }
}

.floating-label{
    position:absolute;

    padding:9px 12px;

    border:
    1px solid var(--line);

    background:
    rgba(4,11,20,.75);

    backdrop-filter:blur(12px);

    border-radius:9px;

    color:var(--gold-light);

    font-size:9px;
    letter-spacing:1px;

    animation:
    labelFloat 4s
    ease-in-out
    infinite;
}

.label-one{
    left:0;
    top:22%;
}

.label-two{
    right:-5px;
    bottom:22%;
    animation-delay:1.2s;
}

@keyframes labelFloat{
    50%{
        transform:translateY(-8px);
    }
}

/* =========================================================
   SECTION COMMON
========================================================= */

section{
    padding:100px 0;
    position:relative;
}

.section-head{
    max-width:730px;
    margin-bottom:43px;
}

.eyebrow{
    color:var(--gold);
    font-size:11px;
    font-weight:900;
    letter-spacing:2.5px;
    text-transform:uppercase;
}

.section-head h2{
    margin-top:10px;

    font-size:
    clamp(
        31px,
        4vw,
        52px
    );

    line-height:1.08;
}

.section-head p{
    color:var(--muted);
    line-height:1.75;
    margin-top:15px;
}

/* =========================================================
   ABOUT
========================================================= */

.about-grid{
    display:grid;

    grid-template-columns:
    1fr
    1fr;

    gap:50px;

    align-items:center;
}

.factory-visual{
    min-height:440px;

    position:relative;

    overflow:hidden;

    border:
    1px solid var(--line);

    border-radius:28px;

    background:
    linear-gradient(
        145deg,
        #112f50,
        #06101c
    );

    display:flex;

    align-items:center;
    justify-content:center;
}

.factory-grid{
    position:absolute;
    inset:0;

    background-image:
    linear-gradient(
        rgba(245,189,69,.08) 1px,
        transparent 1px
    ),
    linear-gradient(
        90deg,
        rgba(245,189,69,.08) 1px,
        transparent 1px
    );

    background-size:35px 35px;

    transform:
    perspective(500px)
    rotateX(55deg)
    translateY(100px);

    opacity:.35;
}

.factory-machine{
    position:relative;
    z-index:2;

    font-size:145px;

    filter:
    drop-shadow(
        0 20px 25px
        rgba(0,0,0,.6)
    );

    animation:
    machineFloat 4s
    ease-in-out
    infinite;
}

@keyframes machineFloat{
    50%{
        transform:
        translateY(-10px)
        rotate(-3deg)
        scale(1.04);
    }
}

.factory-badge{
    position:absolute;

    left:20px;
    bottom:20px;

    padding:10px 13px;

    border:
    1px solid
    rgba(245,189,69,.25);

    background:
    rgba(0,0,0,.35);

    backdrop-filter:blur(8px);

    border-radius:9px;

    color:var(--gold-light);

    font-size:9px;

    letter-spacing:2px;
}

.about-copy h2{
    margin-top:9px;

    font-size:
    clamp(
        30px,
        4vw,
        48px
    );

    line-height:1.1;
}

.about-copy p{
    color:var(--muted);

    line-height:1.8;

    margin-top:18px;
}

.about-points{
    display:grid;

    gap:14px;

    margin-top:25px;
}

.about-point{
    display:flex;

    gap:12px;

    align-items:flex-start;
}

.point-icon{
    width:34px;
    height:34px;

    flex:none;

    display:grid;
    place-items:center;

    border-radius:9px;

    background:
    rgba(245,189,69,.09);

    color:var(--gold);

    border:
    1px solid
    rgba(245,189,69,.18);
}

.about-point strong{
    display:block;

    font-size:14px;

    margin-bottom:4px;
}

.about-point span{
    display:block;

    color:#8999ad;

    font-size:12px;

    line-height:1.6;
}

/* =========================================================
   STATS
========================================================= */

.stats{
    margin-top:45px;

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:14px;
}

.stat{
    padding:22px 15px;

    text-align:center;

    border:
    1px solid var(--line);

    border-radius:16px;

    background:
    rgba(255,255,255,.035);

    transition:.3s;
}

.stat:hover{
    transform:translateY(-5px);

    border-color:
    rgba(245,189,69,.35);
}

.stat strong{
    display:block;

    color:var(--gold);

    font-size:29px;
}

.stat span{
    display:block;

    color:#8e9daf;

    font-size:10px;

    margin-top:5px;
}

/* =========================================================
   PRODUCTS
========================================================= */

.product-grid{
    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:18px;
}

.product-card{
    position:relative;

    overflow:hidden;

    min-height:310px;

    padding:27px;

    border:
    1px solid var(--line);

    border-radius:20px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.025)
    );

    transition:
    transform .35s,
    border-color .35s,
    box-shadow .35s;
}

.product-card:before{
    content:"";

    position:absolute;

    width:160px;
    height:160px;

    right:-70px;
    top:-70px;

    background:var(--gold);

    filter:blur(75px);

    opacity:.09;
}

.product-card:hover{
    transform:
    translateY(-9px);

    border-color:
    rgba(245,189,69,.48);

    box-shadow:
    0 20px 55px
    rgba(0,0,0,.24);
}

.product-number{
    position:absolute;

    top:20px;
    right:22px;

    color:
    rgba(255,255,255,.12);

    font-size:34px;

    font-weight:900;
}

.product-icon{
    width:65px;
    height:65px;

    display:grid;
    place-items:center;

    border-radius:16px;

    font-size:31px;

    background:
    rgba(245,189,69,.08);

    border:
    1px solid
    rgba(245,189,69,.16);

    margin-bottom:20px;
}

.product-card h3{
    font-size:19px;

    margin-bottom:11px;
}

.product-card p{
    color:var(--muted);

    font-size:13px;

    line-height:1.75;
}

.product-tag{
    display:inline-block;

    margin-top:19px;

    padding:
    6px 9px;

    border-radius:6px;

    color:var(--gold-light);

    background:
    rgba(245,189,69,.09);

    font-size:9px;

    text-transform:uppercase;

    letter-spacing:1.3px;
}

/* =========================================================
   PRODUCT NOTE
========================================================= */

.product-note{
    margin-top:25px;

    padding:17px 20px;

    border-left:
    3px solid
    var(--gold);

    border-radius:8px;

    background:
    rgba(245,189,69,.045);

    color:#9eacbe;

    font-size:12px;

    line-height:1.7;
}

/* =========================================================
   GALLERY
========================================================= */

.gallery-grid{
    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:14px;
}

.gallery-item{
    height:230px;

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
    1px solid var(--line);

    border-radius:18px;

    background:
    radial-gradient(
        circle at 50% 30%,
        rgba(245,189,69,.22),
        transparent 55%
    ),
    #0a1929;

    transition:.4s;
}

.gallery-item:nth-child(2){
    background:
    radial-gradient(
        circle at 50% 30%,
        rgba(50,130,255,.22),
        transparent 55%
    ),
    #0a1929;
}

.gallery-item:nth-child(3){
    background:
    radial-gradient(
        circle at 50% 30%,
        rgba(255,255,255,.18),
        transparent 55%
    ),
    #0a1929;
}

.gallery-item:nth-child(4){
    background:
    radial-gradient(
        circle at 50% 30%,
        rgba(40,220,150,.17),
        transparent 55%
    ),
    #0a1929;
}

.gallery-item:hover{
    transform:
    translateY(-7px);

    border-color:
    rgba(245,189,69,.4);
}

.material{
    font-size:68px;

    letter-spacing:5px;

    filter:
    drop-shadow(
        0 8px 12px
        rgba(0,0,0,.7)
    );

    animation:
    materialFloat 3.2s
    ease-in-out
    infinite;
}

@keyframes materialFloat{
    50%{
        transform:
        translateY(-8px)
        rotate(2deg);
    }
}

.gallery-label{
    position:absolute;

    left:15px;
    bottom:14px;

    padding:7px 10px;

    background:
    rgba(0,0,0,.5);

    backdrop-filter:blur(7px);

    border-radius:7px;

    color:white;

    font-size:9px;

    letter-spacing:1px;
}

/* =========================================================
   SERVICES
========================================================= */

 <section id="services">

<div class="container">

<div class="section-title reveal">
    <div class="eyebrow">Our Services</div>

    <h2>
        Industrial Supply &
        Business Support
    </h2>

    <p>
        Professional support for customers looking
        for recycled plastic materials.
    </p>
</div>

<div class="services">

    <div class="service reveal">

<script>

/* LOADER */

window.addEventListener("load", function(){

    setTimeout(function(){

        const loader =
        document.getElementById("loader");

        if(loader){
            loader.classList.add("hide");
        }

    },700);

});


/* MOBILE MENU */

const menu =
document.getElementById("menu");

const navLinks =
document.getElementById("navLinks");

if(menu && navLinks){

    menu.addEventListener("click", function(){

        navLinks.classList.toggle("open");

        menu.innerHTML =
        navLinks.classList.contains("open")
        ? "✕"
        : "☰";

    });

}


document
.querySelectorAll(".nav-links a")
.forEach(function(link){

    link.addEventListener("click", function(){

        if(navLinks){
            navLinks.classList.remove("open");
        }

        if(menu){
            menu.innerHTML="☰";
        }

    });

});


/* NAVBAR */

const navbar =
document.getElementById("navbar");

window.addEventListener("scroll", function(){

    if(!navbar) return;

    if(window.scrollY > 50){

        navbar.classList.add("scrolled");

    }else{

        navbar.classList.remove("scrolled");

    }

});


/* REVEAL ANIMATION */

const observer =
new IntersectionObserver(
function(entries){

    entries.forEach(function(entry){

        if(entry.isIntersecting){

            entry.target.classList.add("show");

        }

    });

},
{
    threshold:.12
});


document
.querySelectorAll(".reveal")
.forEach(function(el){

    observer.observe(el);

});


/* PARTICLES */

const canvas =
document.getElementById("particles");

if(canvas){

    const ctx =
    canvas.getContext("2d");

    let particles=[];


    function resize(){

        canvas.width =
        window.innerWidth;

        canvas.height =
        window.innerHeight;

        particles=[];

        const count =
        Math.min(
            90,
            Math.floor(
                window.innerWidth / 12
            )
        );


        for(let i=0;i<count;i++){

            particles.push({

                x:
                Math.random()
                * canvas.width,

                y:
                Math.random()
                * canvas.height,

                vx:
                (Math.random()-.5)*.35,

                vy:
                (Math.random()-.5)*.35,

                r:
                Math.random()*1.5+.3

            });

        }

    }


    function animate(){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        particles.forEach(function(p){

            p.x += p.vx;
            p.y += p.vy;


            if(
                p.x < 0 ||
                p.x > canvas.width
            ){
                p.vx *= -1;
            }


            if(
                p.y < 0 ||
                p.y > canvas.height
            ){
                p.vy *= -1;
            }


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.r,
                0,
                Math.PI*2
            );


            ctx.fillStyle =
            "rgba(244,189,69,.5)";

            ctx.fill();

        });


        requestAnimationFrame(animate);

    }


    resize();
    animate();


    window.addEventListener(
        "resize",
        resize
    );

}


/* 3D STAR MOUSE EFFECT */

const starScene =
document.getElementById("starScene");


if(
    starScene &&
    window.innerWidth > 900
){

    document.addEventListener(
        "mousemove",
        function(e){

            const x =
            (
                e.clientX /
                window.innerWidth
                -.5
            ) * 14;


            const y =
            (
                e.clientY /
                window.innerHeight
                -.5
            ) * -10;


            starScene.style.transform =

            `
            rotateX(${y}deg)
            rotateY(${x}deg)
            translateY(-5px)
            `;

        }
    );

}


/* CONTACT FORM */

const form =
document.getElementById("contactForm");

const success =
document.getElementById("success");


if(form){

    form.addEventListener(
        "submit",
        function(e){

            e.preventDefault();


            if(success){

                success.classList.add("show");

            }


            setTimeout(
                function(){

                    form.reset();

                },
                500
            );

        }
    );

}


/* TOP BUTTON */

const topButton =
document.getElementById("top");


if(topButton){

    window.addEventListener(
        "scroll",
        function(){

            if(window.scrollY > 500){

                topButton.classList.add("show");

            }else{

                topButton.classList.remove("show");

            }

        }
    );


    topButton.addEventListener(
        "click",
        function(){

            window.scrollTo({

                top:0,

                behavior:"smooth"

            });

        }
    );

}

</script>
